title: Sensitive Credential File Access Anomalies
id: e8a12c41-92cb-4fa1-8207-6f81b10a0008
status: test
description: Detects unexpected non-system access to shadow or private authentication configurations.
author: Do Dinh Huy Hoang
logsource:
    category: file_access
    product: linux
detection:
    selection:
        file.path:
            - '/etc/shadow'
            - '/etc/sudoers'
            - '/root/.ssh/id_rsa'
    filter:
        process.executable:
            - '/usr/bin/sudo'
            - '/usr/sbin/useradd'
            - '/usr/sbin/usermod'
            - '/usr/bin/passwd'
    condition: selection and not filter
falsepositives:
    - Legitimate configuration management (Ansible, Puppet).
level: high
tags:
    - attack.credential_access
    - attack.t1003.008
