title: Suspicious io_uring Subsystem Initialization
id: e8a12c41-92cb-4fa1-8207-6f81b10a0001
status: experimental
description: Detects the invocation of the io_uring_setup system call, an essential chokepoint required before any asynchronous I/O execution.
author: Do Dinh Huy Hoang
references:
    - https://github.com/Hoang456-crush/Linux-EDR-Evasion-io_uring
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        syscall: 'io_uring_setup'
    filter_benign:
        process.executable:
            - '/usr/bin/qemu-system-x86_64'
            - '/usr/sbin/mysqld'
            - '/usr/bin/redis-server'
    condition: selection and not filter_benign
falsepositives:
    - High-performance database engines and hypervisors.
level: medium
tags:
    - attack.defense_evasion
    - attack.t1574
